<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Herramienta para Redacción de Juicios Evaluativos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — a fixed left tree (dimensión › criterio › nivel › enunciado), a working panel with tabs, and two full-width views (panel de avance, documento). */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f8; --line:#d9dcea; --ink:#1d2333; --ink-2:#4c5470; --ink-3:#7d849c;
  --accent:#3047C7; --accent-soft:#CAD0F2; --accent-ink:#ffffff;
  --ok:#03BF6A; --warn:#FFB701; --bad:#FF6647; --pink:#FF9BA2;
  --ok-soft:#d6f5e6; --warn-soft:#fff1cc; --bad-soft:#ffd9d3;
  --font-ui:"Duplet",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-doc:"Duplet",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
  --radius:6px; --shadow:0 1px 2px rgba(29,35,51,.06),0 4px 14px rgba(29,35,51,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141726; --surface:#1c2033; --surface-2:#232840; --line:#343a57; --ink:#e8eaf3; --ink-2:#b4b9cf; --ink-3:#8a90ab;
  --accent:#8b9af0; --accent-soft:#2b3462; --accent-ink:#0f1224;
  --ok-soft:#173a2b; --warn-soft:#3f3419; --bad-soft:#47241f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141726; --surface:#1c2033; --surface-2:#232840; --line:#343a57; --ink:#e8eaf3; --ink-2:#b4b9cf; --ink-3:#8a90ab;
  --accent:#8b9af0; --accent-soft:#2b3462; --accent-ink:#0f1224;
  --ok-soft:#173a2b; --warn-soft:#3f3419; --bad-soft:#47241f; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;overflow-x:hidden}
.main>*{min-width:0}
.tree{min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;min-height:100%}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 260px}
.brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}
.brand small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;flex:0 1 auto}
.nav button{border:1px solid transparent;background:transparent;padding:6px 12px;border-radius:999px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button:hover{border-color:var(--line)}
.demo{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:2px 6px;white-space:nowrap;order:3}
/* body */
.work{display:grid;grid-template-columns:320px minmax(0,1fr);flex:1;min-height:0}
.tree{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 8px 24px}
.tree .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);margin-bottom:8px}
.dim{margin:10px 6px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.crit{margin:2px 0}
.crit>button{width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:var(--radius);display:flex;gap:8px;align-items:center;color:var(--ink)}
.crit>button:hover{background:var(--surface-2)}
.crit .bar{margin-left:auto;display:flex;gap:2px}
.crit .bar i{display:block;width:7px;height:7px;border-radius:2px;background:var(--line)}
.lvl{padding:2px 0 4px 14px}
.lvl h4{margin:6px 0 2px;font-size:11px;color:var(--ink-3);font-weight:600}
.enun{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:var(--radius);color:var(--ink-2)}
.enun:hover{background:var(--surface-2)}
.enun[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.enun code{font-family:var(--font-mono);font-size:11px;color:var(--ink)}
.enun .t{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.dot.s1{background:var(--warn)} .dot.s2{background:var(--accent)} .dot.s3{background:var(--ok)} .dot.s4{background:#FF9BA2}
.main{overflow:auto;padding:18px 22px 40px;min-width:0}
.view{display:none} .view.on{display:block}
/* editor header */
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;margin-bottom:10px}
.head .code{font-family:var(--font-mono);font-size:22px;font-weight:500;color:var(--accent)}
.head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.tipo{background:var(--accent-soft);color:var(--ink);border-color:transparent;font-weight:600}
.head .ctrl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:7px 9px}
textarea{width:100%;min-height:58px;resize:vertical;line-height:1.4}
.quote{font-family:var(--font-doc);font-size:16px;line-height:1.5;border-left:3px solid var(--accent);padding:6px 14px;margin:6px 0 14px;color:var(--ink)}
.quote small{display:block;font-family:var(--font-ui);font-size:12px;color:var(--ink-3);margin-top:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab{display:none} .tab.on{display:block}
/* editor grid */
.edit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}.edit>*{min-width:0}
@media (max-width:1100px){.edit{grid-template-columns:1fr}}
@media (max-width:820px){.work{grid-template-columns:1fr}.tree{display:none}.tree.open{display:block;position:fixed;inset:0;z-index:4;padding-top:calc(60px + env(safe-area-inset-top,0px))}.app.nocat .tree.open,.app .tree.open{display:block!important}.brand small{display:none}.brand{flex:1 1 120px;order:-1}.brand h1{font-size:14px;white-space:normal}.top .menu{order:0;padding:4px 8px;font-size:13px}.demo{order:1;font-size:10px}.nav{margin-left:0;width:100%}.nav button{padding:5px 9px;font-size:13px}.head .ctrl{margin-left:0}.head .ctrl input[type=text]{width:100%!important}.main{padding:14px 16px 40px}}
.top .menu{display:none;border:1px solid var(--line);background:none;border-radius:var(--radius);padding:5px 10px;align-items:center;gap:6px;font-weight:500;color:var(--ink-2)}
.top .menu[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.app[data-view="editor"] .top .menu{display:inline-flex}
.app:not([data-view="editor"]) .work,.app.nocat .work{grid-template-columns:minmax(0,1fr)}
.app:not([data-view="editor"]) .tree,.app.nocat .tree{display:none}
.bloque{margin-bottom:14px}
.bloque h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.field{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .k{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent);padding-top:6px}
.field .k b{display:block;font:inherit;color:var(--bad);font-weight:600;font-size:10px}
.field label{display:block;font-weight:500;margin-bottom:3px}
.field .hint{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.field .hint em{color:var(--ink-2);font-style:normal;font-weight:500}
.field.opt label::after{content:" | recomendado";font-weight:400;color:var(--ink-3);font-size:12px}
.field .row{display:flex;gap:8px;flex-wrap:wrap}
.field .row select{flex:1 1 220px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:var(--radius);font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* preview */
.sticky{position:sticky;top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-2)}
.prose{font-family:var(--font-doc);font-size:15.5px;line-height:1.6;padding:14px 16px;min-height:120px}
.prose .miss{background:var(--warn-soft);border-radius:3px;padding:0 3px;font-family:var(--font-ui);font-size:12px;color:var(--ink-2)}
.prose .ev{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.prose .opt{color:var(--ink-3)}
.prose .miss.opt{background:var(--surface-2);color:var(--ink-3)}
.prleg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 14px 10px;font-size:12px;color:var(--ink-3)} .prleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.alerts{list-style:none;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.alerts li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:var(--radius);background:var(--surface-2)}
.alerts li.bad{background:var(--bad-soft)} .alerts li.warn{background:var(--warn-soft)} .alerts li.ok{background:var(--ok-soft)}
.alerts li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
.alerts li.bad::before{background:var(--bad)} .alerts li.warn::before{background:var(--warn)} .alerts li.ok::before{background:var(--ok)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:0 14px 10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
/* evidence */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.S3{background:var(--ok-soft);border-color:transparent} .pill.S2{background:var(--warn-soft);border-color:transparent} .pill.S1{background:var(--bad-soft);border-color:transparent}
.pill.verificable{background:var(--ok-soft);border-color:transparent} .pill.implementado{background:var(--accent-soft);border-color:transparent} .pill.declarado{background:var(--surface-2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:14px;border-top:1px solid var(--line)}
.form label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.form input,.form select{width:100%}
.form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:0}
.checks input{width:auto}
/* recursos */
.reclist{list-style:none;margin:0;padding:0}
.reclist li{display:flex;gap:10px;align-items:flex-start;padding:8px 14px;border-top:1px solid var(--line)}
.reclist li:first-child{border-top:0}
.reclist select{padding:3px 6px;font-size:12px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:12px 14px}
.kpi .n{font-size:28px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-3)}
.gridwrap{overflow-x:auto}.grid{display:grid;grid-template-columns:minmax(220px,1.3fr) repeat(3,minmax(90px,1fr));gap:2px 10px;align-items:center;padding:14px;min-width:560px}
.grid .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-bottom:6px}
.grid .c{font-size:13px;padding:4px 0}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{width:14px;height:14px;border-radius:3px;background:var(--line);border:0;padding:0}
.cell.s1{background:var(--warn)} .cell.s2{background:var(--accent)} .cell.s3{background:var(--ok)} .cell.s4{background:#FF9BA2}
.estsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:3px 0 8px;font-size:13px;color:var(--ink-2)}
.estsub b{color:var(--ink);font-weight:600}
.estsub .cell{flex:none;display:inline-block}
.estalert{margin:0 0 8px;padding:8px 12px;border-radius:var(--radius);background:rgba(255,102,71,.10);border:1px solid rgba(255,102,71,.45);font-size:13px;color:var(--ink);max-width:760px}
.estalert ul{margin:4px 0 0 18px;padding:0}
.estalert li{margin:2px 0}
.rolock{margin:0 0 12px;padding:9px 12px;border-radius:var(--radius);background:rgba(255,183,1,.14);border:1px solid rgba(255,183,1,.45);font-size:13.5px}
tr.evon td{background:rgba(48,71,199,.06)}
.evhead{display:flex;align-items:center;gap:10px}
.cell.alert{box-shadow:inset 0 0 0 2px var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:0 14px 12px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
/* documento */
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.doc{font-family:var(--font-doc);max-width:76ch;padding:28px 34px;line-height:1.6;font-size:15.5px}
@media (max-width:600px){.doc{padding:18px 16px}}
.doc h1{font-family:var(--font-ui);font-size:22px;color:var(--accent);text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px}
.doc h2{font-family:var(--font-ui);font-size:15px;color:var(--accent);text-transform:uppercase;margin:26px 0 6px}
.doc h3{font-family:var(--font-ui);font-size:13px;color:var(--ink-2);margin:18px 0 4px}
.doc .lead{font-style:italic;color:var(--ink-2)}
.doc blockquote{margin:6px 0 8px;padding:4px 12px;border-left:2px solid var(--line);color:var(--ink-2);font-size:14.5px}
.doc .ev{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.doc .pend{background:var(--warn-soft);padding:0 3px;border-radius:3px;font-family:var(--font-ui);font-size:12.5px}
.doc ul{padding-left:20px}
.doc table{font-family:var(--font-ui);font-size:12.5px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--ink-3)}
.io textarea{font-family:var(--font-mono);font-size:11px;min-height:120px}
/* referentes de otras IES */
.tabs{overflow-x:auto;scrollbar-width:thin} .tabs button{white-space:nowrap;flex:none}
.rfbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
.rfbar .lab{font-size:12px;color:var(--ink-3);margin-right:2px}
.rfbar .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rfbar select{padding:4px 8px;font-size:13px}
.lv{display:inline-flex;gap:4px;align-items:baseline;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.lv b{font-weight:600;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.lv.down{background:var(--bad-soft);border-color:transparent}
.lvs{display:inline-flex;gap:4px;flex-wrap:wrap}
.lvrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px}
.lvrow .note{margin-right:2px}
.rintro{font-size:13px;color:var(--ink-2);margin:0 0 12px;max-width:95ch}
.rintro b{color:var(--ink)}
tr[data-goref]{cursor:pointer} tr[data-goref]:hover td{background:var(--surface-2)}
td .note{font-size:11.5px}
.rcard{margin-top:14px;scroll-margin-top:12px}
.rcard h3 .ies{color:var(--accent);letter-spacing:.06em}
.rcard h3 .nm{text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;font-size:13px}
.rbody{padding:12px 16px 14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 22px}
.rsec{margin:0 0 12px}
.rsec p{margin:3px 0 0;font-size:13.5px;line-height:1.55}
.rk{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rk .pill{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.evl{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.evl li{margin:1px 0}
.lit{margin:6px 0 2px;padding:3px 0 3px 10px;border-left:2px solid var(--line);font-size:13px;line-height:1.5;color:var(--ink-2);font-style:italic}
.lit small{display:block;font-style:normal;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.rsec.mk{border-left:3px solid var(--line);padding:2px 0 2px 11px}
.rsec.mk.ok{border-left-color:var(--ok)} .rsec.mk.warn{border-left-color:var(--warn)} .rsec.mk.bad{border-left-color:var(--bad)} .rsec.mk.fa{border-left-color:var(--accent)} .rsec.mk.pk{border-left-color:var(--pink)}
.pill.ok{background:var(--ok-soft);border-color:transparent} .pill.warn{background:var(--warn-soft);border-color:transparent} .pill.bad{background:var(--bad-soft);border-color:transparent} .pill.nil{background:var(--surface-2)} .pill.fa{background:var(--accent-soft);border-color:transparent}
.rdet{border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.rdet summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.rdet dl{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr);gap:7px 14px;font-size:13px;line-height:1.5;margin:9px 0 0}
.rdet dt{color:var(--ink-3);font-size:12px;padding-top:1px}
.rdet dd{margin:0}
.rnote{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--radius);padding:7px 10px;margin:0 0 12px}
.lvm{display:inline-flex;gap:2px}

function render(e, html=true, final=false, work=false){
  // final=true: texto para el documento. Omite toda referencia a campos vacíos (sin marcas [Jn: ...]).
  const j=work?WV(J(e.id)):J(e.id); const raw=k=>(j.f[k]||'').trim(); const f=k=>html?esc(raw(k)):raw(k);
  const wrap=(txt,cls)=>html?`<span class="${cls}">${esc(txt)}</span>`:txt;
  const T=t=>html?esc(t):t;
  const has=k=>e.obl.includes(k)||e.rec.includes(k);
  // gris solo para un campo recomendado que sigue vacío (en el borrador); el texto escrito y el documento van en negro
  const vacio=k=>k==='J8'?!(J8OP(e).includes(j.J8sel)||raw('J8')):k==='J11'?!(j.J11sel||raw('J11')):!raw(k);
  const optc=k=>(!final&&e.rec.includes(k)&&vacio(k))?'opt':'';
  const miss=k=>wrap('['+k+': '+CAMPO(e,k).nombre.toLowerCase()+']','miss'+(e.rec.includes(k)?' opt':''));
  const val=k=>f(k)||(final?'':miss(k));
  const p=e.p||{}; const o1=p.o1||'cuenta';
  const out=[];
  if(has('J1')||has('J2')||has('J3')){
    const p1=has('J1')?val('J1'):'', p2=has('J2')?val('J2'):'', p3=has('J3')?val('J3'):'';
    const nexo=/a través de|por medio de|mediante/.test(raw('J1'))?'desde':'a través de';
    const via=p1?`, ${nexo} ${p1},`:'';
    let s='';
    if(o1==='mediante'&&p3) s = p1&&p2?`La Universidad, ${nexo} ${p1} y mediante ${p2}, ${p3}.`:p2?`La Universidad, mediante ${p2}, ${p3}.`:p1?`La Universidad, ${nexo} ${p1}, ${p3}.`:`La Universidad ${p3}.`;
    else if(o1==='consta'&&p3){ const base=`la Universidad${via} ${p3}.`; s = p2?`Según consta en ${p2}, ${base}`:cap(base); }
    else if(p1||p2||p3){ const rel=o1==='proposito'?'con el propósito de':'que'; s='La Universidad'+via; if(p2) s+=` ${T(j.J2v||'cuenta con')} ${p2}`+(p3?`, ${rel} ${p3}`:''); else if(p3) s+=` ${p3}`; s+='.'; }
    if(s) out.push({k:'J1',s,cls:''});
  }
  const add=k=>{ if(!has(k)) return; const v=val(k); if(final&&!v) return; out.push({k,s:T(CON(e,k)).replace('['+k+']',()=>v),cls:optc(k)}); };
  add('J4'); add('J5'); add('J6'); add('J7');
  if(has('J8')){
    const t=J8OP(e).includes(j.J8sel)?j.J8sel:''; const j8=f('J8'); const con=T((p.J8&&p.J8.con)||'Ello permite sostener que {op}; {txt}.');
    if(t) out.push({k:'J8',s:frase8(con,T(t),j8,raw('J8')),cls:optc('J8')});
    else if(!final) out.push({k:'J8',s:frase8(con,miss('J8'),j8,raw('J8')),cls:optc('J8')});
    else if(j8) out.push({k:'J8',s:`Respecto de ${T(p.obj||'lo que exige el enunciado')}, ${j8}.`,cls:optc('J8')});
  }
  add('J9'); add('J10');
  if(has('J11')){
    if(!final) out.push({k:'J11',s:`En consecuencia, el enunciado ${e.id} ${j.J11sel||miss('J11')}${f('J11')?'; queda pendiente '+f('J11'):''}.`,cls:''});
    else if(j.J11sel) out.push({k:'J11',s:`En consecuencia, el enunciado ${e.id} ${j.J11sel}${f('J11')?'; queda pendiente '+f('J11'):''}.`,cls:''});
    else if(f('J11')) out.push({k:'J11',s:`Queda pendiente ${f('J11')}.`,cls:''});
  }
  return out.map(o=>{ let s=contr(o.s.replace(/\s+\./g,'.').replace(/\.{2,}/g,'.').replace(/\s{2,}/g,' ')); if(html){ const c=cite(e.id,o.k==='J1'?'J2':o.k); return `<span class="${o.cls}">${s}</span>${c}`; } return s; }).join(' ');
}
function alerts(e, work=false){
  const j=work?WV(J(e.id)):J(e.id); const a=[];
  const vac=e.obl.filter(r=>!filled(j,r));
  if(vac.length) a.push({c:'bad',t:`Campos obligatorios vacíos: ${vac.join(', ')}.`});
  const txt=Object.values(j.f).join(' ').toLowerCase();
  const found=PROS.filter(p=>new RegExp('\\b'+p.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(txt));
  if(found.length) a.push({c:'warn',t:`Términos proscritos: ${found.join(', ')}. Reemplace por un dato o por el vocabulario controlado.`});
  if(j.J8sel && !J8OP(e).includes(j.J8sel)) a.push({c:'bad',t:`La valoración guardada ("${j.J8sel}") pertenece a la escala anterior. Elija en J8 una opción de la escala de este enunciado.`});
  if(e.obl.includes('J7') && filled(j,'J7') && years(j.f.J7)<3) a.push({c:'warn',t:`J7 menciona ${years(j.f.J7)} año(s): el enunciado exige una serie de al menos tres años y un comparador.`});
  const req=(txt.match(/evidencia requerida/g)||[]).length; if(req) a.push({c:'warn',t:`${req} campo(s) marcados [EVIDENCIA REQUERIDA]. El veredicto no puede ser "se verifica".`});
  if(j.J11sel==='se verifica' && (vac.length||req)) a.push({c:'bad',t:'Veredicto "se verifica" con campos vacíos o evidencia requerida: incoherente.'});
  const evs=evFor(e.id); const sinEv=e.obl.filter(r=>r!=='J8'&&r!=='J11'&&filled(j,r)&&!evFor(e.id,r).length);
  if(!evs.length) a.push({c:'warn',t:'Sin evidencias registradas para este enunciado.'}); else if(sinEv.length) a.push({c:'warn',t:`Campos llenos sin evidencia vinculada: ${sinEv.join(', ')}.`});
  const s1=evs.filter(v=>v.solidez==='S1').length; if(s1) a.push({c:'warn',t:`${s1} evidencia(s) de solidez S1 (anecdótica o sin respaldo): no sostienen un veredicto pleno.`});
  if(e.obl.includes('J9') && filled(j,'J9') && !evFor(e.id,'J9').length) a.push({c:'warn',t:'J9 describe un ajuste sin acta o documento vinculado.'});
  if(!a.length) a.push({c:'ok',t:'Sin alertas. Listo para revisión.'});
  return a;
}

const PROSCRITOS_TXT = D.proscritos.join(', ');
function iaPrompt(e,j){
  const valOf=k=>k==='J8'?[j.J8sel,j.f.J8].filter(Boolean).join('; '):k==='J11'?[j.J11sel,j.f.J11].filter(Boolean).join('; queda pendiente '):((j.f[k]||'').trim());
  const campos=[...e.obl,...e.rec].map(k=>[k,valOf(k)]).filter(([,v])=>v).map(([k,v])=>`${k} (${CAMPO(e,k).nombre}): ${v}`).join('\n');
  const evs=evFor(e.id).map(v=>`${v.ev} | ${v.titulo} | plano ${v.plano} | solidez ${v.solidez} | respalda ${v.campos.join(' ')}`).join('\n')||'ninguna';
  const keep=[j.J8sel?`el grado de la valoración ("${j.J8sel}")`:'', j.J11sel?`el veredicto final ("${j.J11sel}")`:''].filter(Boolean).join(' y ');
  return `Eres redactor técnico de un informe de autoevaluación institucional para la acreditación de universidades en Chile (CNA-Chile). Debes reescribir un juicio evaluativo generado automáticamente por plantilla para que quede fluido y sin redundancias, conservando toda su información.

ENUNCIADO CNA que se evalúa (${e.id}, tipo ${e.tipo}): "${e.texto}"

CAMPOS COMPLETADOS POR EL REDACTOR (única fuente de información permitida):
${campos||'(ninguno)'}

EVIDENCIAS VINCULADAS (cítelas con su código entre corchetes donde correspondan):
${evs}

TEXTO GENERADO POR LA PLANTILLA (versión a mejorar):
${render(e,false,true)}

REGLAS ESTRICTAS:
1. No agregue ningún dato, nombre, cifra, año, acto administrativo ni evidencia que no esté en los campos. No infiera ni complete información ausente y no aluda a ella: no escriba marcas como [vacío] o [J4: …], ni frases sobre lo que no se informa. Si el redactor escribió una marca [EVIDENCIA REQUERIDA: …], consérvela literalmente.
2. Conserve el orden de los bloques presentes: dispositivo (unidad, mecanismo, función), despliegue (alcance, acciones, coordinación), resultados (indicador, valor, serie, comparador, valoración), ciclo de mejora (ajuste, continuidad) y síntesis (veredicto). Omita los bloques sin información.
3. Mencione el nombre completo del mecanismo una sola vez; después use referencias breves.
4. ${keep?`Conserve literalmente ${keep}; no los suavice ni los cambie.`:'No agregue valoraciones ni veredictos que no estén en los campos.'}
5. Tercera persona, registro institucional chileno, frases cortas. Prohibidos: ${PROSCRITOS_TXT}. Sin adjetivos de grado ni fórmulas promocionales.
6. Un solo párrafo de hasta 220 palabras; no lo alargue para alcanzar una extensión. Sin título, sin comillas, sin comentarios: devuelva únicamente el juicio reescrito.`;
}
function iaFidelity(e,j,text){
  const src=(e.id+' '+Object.values(j.f).join(' ')+' '+j.J8sel+' '+j.J11sel+' '+e.texto+' '+evFor(e.id).map(v=>v.ev+' '+v.titulo+' '+(v.anio||'')).join(' ')).toLowerCase();
  const NUMRX=/\d[\d.,]*(?:\s?%)?/g; const norm=x=>x.replace(/\s?%$/,'').replace(/[.,]+$/,'').replace(/\s/g,'');
  const srcNums=new Set((src.match(NUMRX)||[]).map(norm));
  for(const m of src.matchAll(/(\d{4})\s*[–\-]\s*(\d{4})/g)){ const a=+m[1], b=+m[2]; if(b>a && b-a<40) for(let y=a;y<=b;y++) srcNums.add(String(y)); }
  const nums=[...new Set((text.match(NUMRX)||[]).map(norm).filter(Boolean))].filter(n=>!srcNums.has(n));
  const evs=[...new Set(text.match(/EV-\d{4}-\d{3}/g)||[])].filter(c=>!evFor(e.id).some(v=>v.ev===c));
  const low=text.toLowerCase(); const pros=PROS.filter(p=>new RegExp('\\b'+p.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(low));
  const words=text.trim().split(/\s+/).length; const out=[];
  if(nums.length) out.push({c:'bad',t:'Cifras del texto mejorado que no aparecen en los campos ni en las evidencias vinculadas: '+nums.join(', ')+'. Posible dato inventado por la IA; verifique antes de aceptar.'});
  if(evs.length) out.push({c:'bad',t:'Códigos de evidencia inexistentes: '+evs.join(', ')+'.'});
  if(j.J8sel && !low.includes(j.J8sel.toLowerCase())) out.push({c:'warn',t:'No conserva literalmente el término de valoración J8 ("'+j.J8sel+'").'});
  if(j.J11sel && !low.includes(j.J11sel.toLowerCase())) out.push({c:'bad',t:'No conserva el veredicto J11 ("'+j.J11sel+'").'});
  if(pros.length) out.push({c:'warn',t:'Términos proscritos: '+pros.join(', ')+'.'});
  const marks=(text.match(/\[(?!EVIDENCIA REQUERIDA)[^\]]{0,60}\]/gi)||[]).filter(m=>!/^\[EV-\d{4}-\d{3}/.test(m));
  if(marks.length) out.push({c:'bad',t:'El texto contiene marcas de campos vacíos: '+[...new Set(marks)].join(', ')+'. Regenere o edite antes de aceptar.'});
  if(words>240) out.push({c:'warn',t:`Extensión: ${words} palabras (máximo 220).`});
  if(!out.length) out.push({c:'ok',t:`Fidelidad verificada: ${words} palabras; sin cifras nuevas, sin evidencias inventadas, veredictos conservados.`});
  return out;
}
function bindIA(e,j){
  const v=$('#view-editor'); const btn=$('#btnIA',v), stop=$('#btnIAStop',v), box=$('#iaBox',v), prose=$('#iaProse',v), state=$('#iaState',v), checks=$('#iaChecks',v), use=$('#btnIAUse',v), redo=$('#btnIARedo',v), drop=$('#btnIADrop',v);
  if(!btn) return;
  if(j.ia){ checks.innerHTML=iaFidelity(e,j,j.ia).map(a=>`<li class="${a.c}">${esc(a.t)}</li>`).join(''); }
  const run=async(fresh)=>{
    if(!SAMPLE) return; const pend=dirtyFields(e,j); if(pend.length){ pend.forEach(k=>commitField(j,k)); if(j.d) delete j.d; save(); $$('[data-field]',$('#view-editor')).forEach(fd=>{ const k=fd.dataset.field; fd.classList.remove('dirty'); const fs=$('#fs-'+k); if(fs) fs.innerHTML=fsaveHTML(j,k); }); const sbar=$('#saveBar'); if(sbar) sbar.hidden=true; tree(); toast(`Se guardaron ${pend.join(', ')} antes de consultar a la IA`); }
    iaCtl=new AbortController(); box.hidden=false; use.hidden=false; redo.hidden=true; stop.hidden=false; btn.disabled=true; drop.textContent='Descartar';
    state.textContent='pensando…'; prose.textContent='La IA está leyendo los campos y la evidencia…'; checks.innerHTML='';
    try{
      const r=await SAMPLE(iaPrompt(e,j),{signal:iaCtl.signal, modelTier:'default', cache: fresh?false:true, onText:({text})=>{ prose.textContent=text; state.textContent='escribiendo…'; }});
      const text=r.text.trim(); prose.textContent=text; j.iaDraft=text; state.textContent=r.truncated?'respuesta cortada':'borrador listo';
      checks.innerHTML=iaFidelity(e,j,text).map(a=>`<li class="${a.c}">${esc(a.t)}</li>`).join(''); redo.hidden=false;
    }catch(err){
      const code=err&&err.code; if(code==='cancelled'){ state.textContent='detenido'; if(err.text) prose.textContent=err.text; }
      else if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'){ box.hidden=true; btn.disabled=true; btn.title='La IA no está habilitada para este visor'; toast('La IA no está habilitada en esta vista'); }
      else if(code==='rate_limited'){ state.textContent='límite de uso alcanzado; intente más tarde'; }
      else if(code==='refused'){ prose.textContent=''; state.textContent='la IA declinó esta solicitud'; }
      else { state.textContent='error temporal; puede reintentar'; if(err&&err.text) prose.textContent=err.text; }
    } finally { stop.hidden=true; btn.disabled=!SAMPLE; iaCtl=null; }
  };
  btn.addEventListener('click',()=>run(false));
  redo.addEventListener('click',()=>run(true));
  stop.addEventListener('click',()=>{ if(iaCtl) iaCtl.abort(); });
  use.addEventListener('click',()=>{ if(!j.iaDraft) return; j.ia=j.iaDraft; save(); editor(); toast('Versión mejorada aceptada'); });

  ${man.length?`<div class="card alman" style="margin-top:14px"><h3>Procesos ingresados manualmente <span class="right">${man.length}</span></h3><ul>${man.map(p=>`<li><span><b>${esc(p.ies||'—')}</b> ${p.acta?'| Sesión N° '+esc(p.acta):''} ${p.anio?'| '+esc(p.anio):''} ${p.nota?`<span class="note">| ${esc(p.nota)}</span>`:''}</span><button class="btn small" data-aledit="${p.id}">Editar</button><button class="btn small danger" data-aldel="${p.id}">Eliminar</button></li>`).join('')}</ul>

function alForm(v){
  const box=$('#alFormBox',v); if(!box) return;
  if(!AL_EDIT){ box.innerHTML=''; return; }
  const st=alSt(); const p=AL_EDIT==='new'?{lv:{}}:(st.procesos.find(x=>x.id===AL_EDIT)||{lv:{}});

  const sel=(c,k)=>{ const val=((p.lv||{})[c]||{})[k]; return `<select data-alc="${c}" data-alk="${k}" aria-label="C${c} ${k==='a'?'IAE':k==='p'?'Pares':'Comisión'}"><option value=""></option><option value="0" ${val===0?'selected':''}>N/C</option>${[1,2,3].map(n=>`<option ${val===n?'selected':''}>${n}</option>`).join('')}</select>`; };
  box.innerHTML=`<div class="card" style="margin-top:14px" id="alForm"><h3>${AL_EDIT==='new'?'Agregar proceso':'Editar proceso'} <span class="right">N/C (no cumple) o niveles 1 a 3; en blanco si no consta</span></h3>
  <div class="form">
    <div><label for="afIes">Institución (sigla)</label><input type="text" id="afIes" value="${esc(p.ies||'')}" placeholder="Ej.: UV"></div>
    <div><label for="afNom">Nombre</label><input type="text" id="afNom" value="${esc(p.nombre||'')}"></div>
    <div><label for="afActa">Sesión o acta N°</label><input type="text" id="afActa" value="${esc(p.acta||'')}" placeholder="Ej.: 2.844"></div>
    <div><label for="afAnio">Año</label><input type="text" id="afAnio" inputmode="numeric" value="${esc(p.anio||'')}"></div>
    <div><label for="afRes">Resultado</label><select id="afRes">${AL_RES.map(r=>`<option value="${esc(r)}" ${(p.res||'')===r?'selected':''}>${r||'Sin dato'}</option>`).join('')}</select></div>
    <div><label for="afNota">Fuente o nota</label><input type="text" id="afNota" value="${esc(p.nota||'')}" placeholder="Ej.: Acta p. 4; IEE pp. 18-69"></div>
  </div>
  <div class="tablewrap"><table class="algrid"><thead><tr><th>Instancia</th>${all.map(c=>`<th title="${esc(D.criterios[c].nombre)}">C${c}</th>`).join('')}</tr></thead><tbody>
    ${[['a','IAE'],['p','Pares (IEE)'],['k','Comisión']].map(([k,t])=>`<tr><td>${t}</td>${all.map(c=>`<td>${sel(c,k)}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <div class="tools" style="padding:4px 14px 14px"><button class="btn primary" id="afSave">Guardar proceso</button><button class="btn" id="afCancel">Cancelar</button></div></div>`;
  $('#afCancel',box).addEventListener('click',()=>{ AL_EDIT=null; box.innerHTML=''; });
  $('#afSave',box).addEventListener('click',()=>{
    const q=id=>$('#'+id,box).value.trim(); const lv={};
    $$('select[data-alc]',box).forEach(s=>{ if(s.value){ (lv[s.dataset.alc]=lv[s.dataset.alc]||{})[s.dataset.alk]=+s.value; } });
    const ies=q('afIes'), acta=q('afActa');
    if(!ies&&!acta){ toast('Indique la institución o el N° de sesión'); return; }
    const pares=Object.values(lv).filter(o=>Object.keys(o).length>=2).length;
    if(!pares){ toast('Ingrese al menos un criterio con dos niveles'); return; }
    const rec={id:AL_EDIT==='new'?'m'+Date.now().toString(36):AL_EDIT, ies:ies.toUpperCase(), nombre:q('afNom'), acta, anio:q('afAnio'), res:$('#afRes',box).value, nota:q('afNota'), lv};
    const i=st.procesos.findIndex(x=>x.id===rec.id); if(i>=0) st.procesos[i]=rec; else st.procesos.push(rec);
    save(); AL_EDIT=null; toast('Proceso guardado'); refAlin(v); });
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

function evalBlock(lbl,x){
  x=x||{}; const cita=x.cita?`<blockquote class="lit">"${esc(x.cita)}"<small>${esc(x.fuente||'')}</small></blockquote>`:'';
  return `<div class="rsec"><div class="rk">${lbl} ${valPill(x.valoracion)}</div><p>${esc(x.nota||'')}</p>${cita}</div>`;
}
function refAspectos(v){
  const O=R.orden; const crits=Object.keys(D.criterios); const cn=REFV.crit; const cc=D.criterios[cn];
  const VS=['fortaleza','reconocimiento','reparo','debilidad','no lo considera','sin documento'];
  const cnt=(s,c,ev)=>{ const o={}; (((R.adic[s]||{})[c]||{}).aspectos||[]).forEach(a=>{ const k=(a[ev]||{}).valoracion; o[k]=(o[k]||0)+1; }); return o; };
  const mini=o=>VS.filter(k=>o[k]).map(k=>`<span class="vpill ${VALC[k]}" title="${k}">${o[k]} ${k}</span>`).join(' ')||'<span class="note">—</span>';
  const sel=`<select id="adCrit" aria-label="Criterio">${crits.map(c=>`<option value="${c}" ${c===cn?'selected':''}>Criterio ${c}. ${esc(D.criterios[c].nombre)}</option>`).join('')}</select>`;
  const prev=crits[crits.indexOf(cn)-1], next=crits[crits.indexOf(cn)+1];
  const enun=ENUN.filter(e=>String(e.crit)===cn);
  const rows=O.map(s=>{ const a=((R.adic[s]||{})[cn]||{}).aspectos||[]; return `<tr data-gocra="${s}"><td><b>${s}</b></td><td class="num">${a.length}</td><td>${mini(cnt(s,cn,'pares'))}</td><td>${mini(cnt(s,cn,'cna'))}</td></tr>`; }).join('');
  const chips=`<button class="btn small ${REFV.ies==='todas'?'on':''}" data-adies="todas">Todas</button>`+O.map(s=>`<button class="btn small ${REFV.ies===s?'on':''}" data-adies="${s}">${s}</button>`).join('');
  const cards=O.filter(s=>REFV.ies==='todas'||REFV.ies===s).map(s=>{
    const A=(R.adic[s]||{})[cn]||{}; const m=R.meta[s]; const asp=A.aspectos||[];
    const body=asp.map((a,i)=>`<div class="asp"><h4><span class="n">${s}-${cn}.${i+1}</span>${esc(a.titulo)} <span class="vpill ${VALC[(a.pares||{}).valoracion]||'nil'}" title="Pares">Pares: ${esc((a.pares||{}).valoracion||'—')}</span><span class="vpill ${VALC[(a.cna||{}).valoracion]||'nil'}" title="CNA">CNA: ${esc((a.cna||{}).valoracion||'—')}</span></h4>
      <p class="desc">${esc(a.descripcion)}</p><p class="why"><b>Por qué excede los estándares:</b> ${esc(a.por_que_adicional)}</p>
      <blockquote class="lit">"${esc(a.cita_iae)}"<small>${esc(a.fuente_iae)}</small></blockquote>
      ${figs(s,cn,a.elementos)}
      <div class="eval2">${evalBlock('Pares evaluadores',a.pares)}${evalBlock('Comisión (CNA)',a.cna)}</div></div>`).join('');
    return `<div class="card rcard" id="adic-${s}"><h3><span class="ies">${s}</span> <span class="nm">${esc(m.nombre)}</span><span class="right">${asp.length} aspecto(s)</span></h3><div class="rbody">${A.sintesis?`<p class="sint">${esc(A.sintesis)}</p>`:''}${body||'<p class="note">Sin aspectos adicionales con desarrollo en el IAE.</p>'}</div></div>`; }).join('');
  // vista de conjunto
  const tot=crits.map(c=>{ let n=0,pc=0,pe=0,cc2=0,ce=0,pf=0,cf=0,pn=0,cnn=0; O.forEach(s=>{ (((R.adic[s]||{})[c]||{}).aspectos||[]).forEach(a=>{ n++; const pv=(a.pares||{}).valoracion, cv=(a.cna||{}).valoracion;

const SBX = window.SB, BT = window.__BOOT, UID = BT.user.id;

function NOMBRE(id){ return window.SYNC ? SYNC.nombre(id) : ''; }
function fecha(t){ if(!t) return ''; const d=new Date(t); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function tamano(b){ b=+b||0; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toLocaleString('es-CL',{maximumFractionDigits:0})+' KB'; if(b<1073741824) return (b/1048576).toLocaleString('es-CL',{maximumFractionDigits:1})+' MB'; return (b/1073741824).toLocaleString('es-CL',{maximumFractionDigits:2})+' GB'; }
function errTxt(e){ const t=(e&&(e.message||e.error||e.msg))||String(e||''); if(/row-level security|permission|not authorized|Unauthorized/i.test(t)) return 'no tiene permiso para esta acción'; if(/Failed to fetch|NetworkError/i.test(t)) return 'sin conexión con el servidor'; if(/exceeded the maximum allowed size|Payload too large|too large/i.test(t)) return 'el archivo supera el tamaño máximo permitido'; return t; }

function fieldOf2(c){ return c==='J2v'?'J2 (verbo)':c==='J8sel'?'J8 (veredicto)':c==='J11sel'?'J11 (veredicto)':c==='estado'?'estado':c==='resp'?'responsable':c==='ia'?'versión con IA':c; }

/* ---------- cambios de otras personas: refrescar sin perder lo que se está escribiendo ---------- */
let refT=null, refQ={};
function refrescarRemoto(info){ if(info&&info.tabla) refQ[info.tabla]=(refQ[info.tabla]||[]).concat(info.r?[info.r]:[]); clearTimeout(refT); refT=setTimeout(()=>{ const q=refQ; refQ={}; aplicarRefresco(q); },300); }
function aplicarRefresco(q){
  if(q.archivos){ archCargar().then(()=>{ if(VIEW==='files') archView(true); }); }

async function archCargar(){ const out=[]; for(let i=0;;i+=1000){ const r=await SBX.from('archivos').select('*').order('subido_en',{ascending:false}).range(i,i+999); if(r.error){ toast('No se pudo cargar la lista de archivos'); return; } out.push(...r.data); if(r.data.length<1000) break; } ARCH.lista=out; ARCH.cargado=true; }
function limpiarNombre(n){ const p=n.lastIndexOf('.'); const base=(p>0?n.slice(0,p):n), ext=(p>0?n.slice(p):''); const s=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); return (s(base).slice(0,100)||'archivo')+s(ext).slice(0,12); }
function tusEndpoint(){ if(BT.cfg.tusEndpoint) return BT.cfg.tusEndpoint; const u=new URL(BT.cfg.url); return u.protocol+'//'+u.host.replace(/\.supabase\.co$/,'.storage.supabase.co')+'/storage/v1/upload/resumable'; }
async function archSubir(file, code, onProg){
  if(file.size>MAXMB*1048576) throw new Error(`supera el máximo de ${MAXMB.toLocaleString('es-CL')} MB por archivo`);
  const id=crypto.randomUUID(), ruta=id+'/'+limpiarNombre(file.name), tipo=file.type||'application/octet-stream';
  if(file.size>6*1048576 && window.tus){
    const { data:{ session } } = await SBX.auth.getSession();
    await new Promise((ok,mal)=>{ const up=new tus.Upload(file,{ endpoint:tusEndpoint(), retryDelays:[0,3000,5000,10000,20000], headers:{ authorization:'Bearer '+session.access_token, 'x-upsert':'false' }, uploadDataDuringCreation:true, removeFingerprintOnSuccess:true, metadata:{ bucketName:'antecedentes', objectName:ruta, contentType:tipo, cacheControl:'3600' }, chunkSize:6*1024*1024, onError:mal, onProgress:(a,b)=>onProg&&onProg(a/b), onSuccess:ok }); up.start(); });
  } else {
    if(onProg) onProg(.3);
    const r=await SBX.storage.from('antecedentes').upload(ruta,file,{contentType:tipo,upsert:false}); if(r.error) throw r.error;
  }
  if(onProg) onProg(1);
  const r=await SBX.from('archivos').insert({id, nombre:file.name, ruta, tamano:file.size, tipo, code:code||null}).select().single();
  if(r.error){ await SBX.storage.from('antecedentes').remove([ruta]); throw r.error; }
  ARCH.lista.unshift(r.data); return r.data;
}

}

const ROLNOM={admin:'Administrador',coordinador:'Coordinación institucional',responsable:'Responsable de criterio'};

function ioView(){
  const v=$('#view-io'); const P=Object.values(BT.perfiles).sort((a,b)=>(a.nombre||a.email).localeCompare(b.nombre||b.email,'es'));

  <div class="card" style="margin-top:14px"><h3>Personas con acceso <span class="right">${P.length}</span></h3><div class="tablewrap"><table class="ptab"><thead><tr><th>Nombre</th><th>Usuario o correo</th><th>Perfil</th><th>Criterios que edita</th>${BT.esAdmin?'<th></th>':''}</tr></thead><tbody>${P.map(p=>filaPersona(p)).join('')}</tbody></table></div>
  <div class="note" style="padding:0 14px 12px"><p style="margin:6px 0"><b>Administrador:</b> ve y edita todo, asigna perfiles y carga los datos. <b>Coordinación institucional:</b> ve y edita todo, salvo los referentes de otras IES; asigna los estados "En revisión" y "Validado". <b>Responsable de criterio:</b> ve todo salvo los referentes y edita solo los juicios de sus criterios; asigna "Sin iniciar", "En redacción" y "Enviado a revisión".</p><p style="margin:6px 0">Las cuentas nuevas se crean en el panel de Supabase (Authentication | Users | Add user) y parten como responsables sin criterios. Para un nombre de usuario genérico, use como correo usuario@${esc((BT.cfg.dominioUsuarios||'ealvarez.cl'))}.</p></div></div>
  ${BT.esAdmin?`<div class="card" style="margin-top:14px"><h3>Datos de la plataforma <span class="right">solo administradores</span></h3><div style="padding:12px 14px"><p class="note" style="margin-top:0">Para actualizar el catálogo, los referentes o los recortes, seleccione de nuevo la carpeta "datos" que entrega la asesoría. Reemplaza los archivos existentes y no toca el trabajo de los usuarios.</p><label class="btn" style="cursor:pointer">Seleccionar la carpeta "datos"<input type="file" id="admDir" webkitdirectory multiple hidden></label><p class="note" id="admProg"></p></div></div>`:''}`;
  $('#btnExport',v).addEventListener('click',()=>{ const blob=new Blob([JSON.stringify({exportado:new Date().toISOString(), por:BT.user.email, estado:S},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='respaldo-juicios-evaluativos-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); });
  $$('[data-prol]',v).forEach(s=>s.addEventListener('change',()=>{ const ck=$(`[data-pcrit="${s.dataset.prol}"]`,v); if(ck) ck.classList.toggle('off',s.value!=='responsable'); }));
  $$('[data-pguardar]',v).forEach(b=>b.addEventListener('click',async()=>{ const id=b.dataset.pguardar; const rol=$(`[data-prol="${id}"]`,v).value; const crit=$$(`[data-pcrit="${id}"] input:checked`,v).map(i=>+i.value);
    b.disabled=true; const r=await SBX.rpc('asignar_perfil',{p_id:id,p_rol:rol,p_criterios:crit}); b.disabled=false;
    if(r.error) return toast('No se pudo guardar el perfil: '+errTxt(r.error)); BT.perfiles[id]=r.data; toast('Perfil guardado: '+(r.data.nombre||r.data.email)); ioView(); }));
  const ad=$('#admDir',v); if(ad) ad.addEventListener('change',async()=>{ const ok=await BT.subirDatos([...ad.files],$('#admProg',v)); if(ok) toast('Datos actualizados: recargue la página para verlos'); });
}

<script src="config.js"></script>

<script>
/* =====================================================================
   Herramienta para Redacción de Juicios Evaluativos | arranque, sesión y sincronización
   Se ejecuta antes que la aplicación. Inicia sesión con Supabase, carga
   los datos privados y el estado compartido, y luego arranca la app.
   ===================================================================== */
(function () {
'use strict';
const CFG = window.MESA_CONFIG || {};
const q = s => document.querySelector(s);
const escH = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// usuario genérico (sin @) -> correo interno usuario@dominio
const DOM = (CFG.dominioUsuarios || 'ealvarez.cl').toLowerCase();
const aCorreo = v => { v = String(v || '').trim().toLowerCase(); return v && !v.includes('@') ? v + '@' + DOM : v; };
window.MESA_USUARIO = e => { e = String(e || ''); return e.toLowerCase().endsWith('@' + DOM) ? e.slice(0, -(DOM.length + 1)) : e; };
const BOOT = window.__BOOT = { D: null, S: null, user: null, perfil: null, perfiles: {}, urls: {}, esAdmin: false, cfg: CFG };
let sb = null;

/* ---------- pantallas de acceso ---------- */
function pantalla(html) { const el = q('#acceso'); el.innerHTML = `<div class="acc-card"><div class="acc-brand">Herramienta para Redacción de Juicios Evaluativos<small>Autoevaluación institucional | criterios y estándares CNA</small></div>${html}</div>`; el.hidden = false; }
function msg(t, tipo) { const m = q('#aMsg'); if (m) { m.textContent = t || ''; m.className = 'acc-msg ' + (tipo || ''); } }
const traducir = e => {
  const t = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  if (/invalid login credentials|invalid_credentials/i.test(t)) return 'Usuario o contraseña incorrectos.';
  if (/email not confirmed/i.test(t)) return 'La cuenta aún no está confirmada. Avise al administrador.';
  if (/password should be at least|weak/i.test(t)) return 'La contraseña es muy débil: use al menos 8 caracteres.';
  if (/rate limit|too many/i.test(t)) return 'Demasiados intentos. Espere unos minutos y vuelva a intentar.';
  if (/failed to fetch|network/i.test(t)) return 'No hay conexión con el servidor. Revise su conexión a internet.';
  return t;
};

function formIngreso(aviso) {
  pantalla(`<form id="fIngreso" class="acc-form" novalidate>
    <label>Usuario o correo<input type="text" id="aEmail" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Contraseña<input type="password" id="aPass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Ingresar</button>
    <button class="lkb" type="button" id="aOlvido">¿Olvidó su contraseña?</button>
    <p class="acc-msg" id="aMsg" role="status" aria-live="polite"></p></form>`);
  if (aviso) msg(aviso, 'ok');
  q('#aEmail').focus();
  q('#fIngreso').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = aCorreo(q('#aEmail').value), password = q('#aPass').value;
    if (!email || !password) return msg('Escriba su usuario y su contraseña.', 'bad');
    msg('Verificando…');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return msg(traducir(error), 'bad');
    entrar(data.session);
  });
  q('#aOlvido').addEventListener('click', async () => {
    const v = q('#aEmail').value.trim();
    if (!v) return msg('Escriba primero su usuario o correo y vuelva a presionar "¿Olvidó su contraseña?".', 'bad');
    if (!v.includes('@')) return msg('Las cuentas con nombre de usuario no recuperan la contraseña por correo. Pida una nueva al administrador.', 'bad');
    const email = v.toLowerCase();
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return msg(traducir(error), 'bad');
    msg('Si el correo está registrado, recibirá un enlace para crear una contraseña nueva.', 'ok');
  });
}

function formNuevaClave() {
  pantalla(`<form id="fClave" class="acc-form">
    <p>Cree su contraseña nueva (al menos 8 caracteres).</p>
    <label>Contraseña nueva<input type="password" id="aP1" autocomplete="new-password" minlength="8" required></label>
    <label>Repítala<input type="password" id="aP2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary" type="submit">Guardar contraseña</button>
    <p class="acc-msg" id="aMsg" role="status" aria-live="polite"></p></form>`);
  q('#fClave').addEventListener('submit', async ev => {
    ev.preventDefault();
    const a = q('#aP1').value, b = q('#aP2').value;
    if (a.length < 8) return msg('Use al menos 8 caracteres.', 'bad');
    if (a !== b) return msg('Las dos contraseñas no coinciden.', 'bad');
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return msg(traducir(error), 'bad');
    history.replaceState(null, '', location.pathname);
    const { data } = await sb.auth.getSession();
    entrar(data.session);
  });
}

function progreso(t) { pantalla(`<p class="acc-load"><span class="spin" aria-hidden="true"></span>${escH(t)}</p>`); }

/* ---------- inicio ---------- */
async function iniciar() {
  if (!CFG.url || !CFG.key || /PEGUE|xxxx/i.test(CFG.url + CFG.key)) {
    return pantalla('<p>Falta configurar la conexión con Supabase: complete la dirección y la clave pública en el archivo <code>config.js</code>.</p>');
  }
  if (!window.supabase) return pantalla('<p>No se pudo cargar la biblioteca de Supabase. Recargue la página.</p>');
  sb = window.SB = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let recuperando = /type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'PASSWORD_RECOVERY') { recuperando = true; formNuevaClave(); }
    if (ev === 'SIGNED_OUT' && BOOT.user) location.reload();
  });
  const { data } = await sb.auth.getSession();
  if (recuperando) return;
  if (!data.session) return formIngreso();
  entrar(data.session);
}

async function entrar(session) {
  try {
    BOOT.user = session.user;
    progreso('Cargando sus datos…');
    const per = await sb.from('perfiles').select('*');
    if (per.error) throw per.error;
    per.data.forEach(p => { BOOT.perfiles[p.id] = p; });
    BOOT.perfil = BOOT.perfiles[session.user.id] || { id: session.user.id, email: session.user.email, nombre: session.user.email, es_admin: false };
    BOOT.rol = BOOT.perfil.rol || (BOOT.perfil.es_admin ? 'admin' : 'responsable');
    BOOT.criterios = (BOOT.perfil.criterios || []).map(Number).sort((a, b) => a - b);
    BOOT.esAdmin = BOOT.rol === 'admin';
    window.MESA_PERM = permisos();
    // ?t= evita que el navegador use una copia anterior guardada en caché (los datos se pueden actualizar)
    const dj = await sb.storage.from('datos').download('plataforma_data.json?t=' + Date.now());
    if (dj.error || !dj.data) {
      if (BOOT.esAdmin) return cargaInicial();
      return pantalla('<p>La plataforma aún no tiene sus datos cargados. Avise al administrador.</p><button class="btn" id="aSalir">Cerrar sesión</button>'), q('#aSalir').addEventListener('click', () => sb.auth.signOut());
    }
    BOOT.D = JSON.parse(await dj.data.text());
    // referentes de otras IES: solo administradores (archivo aparte, protegido en el servidor)
    if (BOOT.esAdmin) {
      if (!BOOT.D.ref) { const rr = await sb.storage.from('datos').download('referentes.json?t=' + Date.now()); if (!rr.error && rr.data) BOOT.D.ref = JSON.parse(await rr.data.text()); }
    } else delete BOOT.D.ref;
    cargarFuentes();
    await firmarRecortes();
    BOOT.S = await SYNC.cargar();
    q('#acceso').hidden = true;
    q('.app').hidden = false;
    const s = document.createElement('script');
    s.textContent = q('#app-src').textContent;
    document.body.appendChild(s);
    SYNC.tiempoReal();
    setInterval(firmarRecortes, 10 * 3600 * 1000);
  } catch (e) {
    console.error(e);
    pantalla(`<p class="acc-msg bad">No se pudo cargar la plataforma: ${escH(traducir(e))}</p><button class="btn" id="aRe">Reintentar</button> <button class="btn" id="aSalir">Cerrar sesión</button>`);
    q('#aRe').addEventListener('click', () => location.reload());
    q('#aSalir').addEventListener('click', () => sb.auth.signOut());
  }
}

/* ---------- permisos según el perfil ---------- */
// admin: todo | coordinador: edita todo, sin referentes | responsable: edita solo sus criterios, sin referentes
function permisos() {
  const rol = BOOT.rol, cr = BOOT.criterios;
  const critDe = code => +((/^C(\d+)-/.exec(code) || [])[1] || 0);
  const NOM = { admin: 'Administrador', coordinador: 'Coordinación institucional', responsable: 'Responsable de criterio' };
  return {
    rol, nombreRol: NOM[rol] || rol, criterios: cr, verRef: rol === 'admin',
    editar: code => rol !== 'responsable' || cr.includes(critDe(code)),
    estados: () => rol === 'responsable' ? [0, 1, 4] : [0, 1, 4, 2, 3],
    motivo: e => rol !== 'responsable' ? '' : `Este enunciado pertenece al criterio ${e.crit}. ` + (cr.length ? `Su perfil edita ${cr.length === 1 ? 'el criterio' : 'los criterios'} ${cr.join(', ')}.` : 'Su perfil aún no tiene criterios asignados; pídale al administrador que los asigne.')
  };
}
BOOT.permisos = permisos;

/* ---------- fuentes y recortes (privados, en el bucket "datos") ---------- */
const FUENTES = [['duplet-300.otf', '300', 'normal'], ['duplet-400.otf', '400', 'normal'], ['duplet-400i.otf', '400', 'italic'], ['duplet-600.otf', '600', 'normal'], ['duplet-700.otf', '700', 'normal']];
async function cargarFuentes() {
  for (const [f, w, st] of FUENTES) {
    try {
      const r = await sb.storage.from('datos').download('fonts/' + f);
      if (r.error) continue;
      const ff = new FontFace('Duplet', await r.data.arrayBuffer(), { weight: w, style: st });
      document.fonts.add(await ff.load());
    } catch (e) { /* sin la fuente se usa la del sistema */ }
  }
}
async function firmarRecortes() {
  const spr = (BOOT.D && BOOT.D.ref && BOOT.D.ref.spr) || {};
  const set = new Set();
  Object.values(spr).forEach(c => Object.values(c).forEach(m => Object.values(m).forEach(v => set.add(v[0]))));
  const paths = [...set];
  for (let i = 0; i < paths.length; i += 100) {
    const r = await sb.storage.from('datos').createSignedUrls(paths.slice(i, i + 100), 12 * 3600);
    if (r.error) continue;
    r.data.forEach(x => { if (x.signedUrl) BOOT.urls[x.path] = x.signedUrl; });
  }
}

/* ---------- carga inicial de datos (solo administrador) ---------- */
function cargaInicial() {
  pantalla(`<p><b>Configuración inicial.</b> Usted es administrador y la plataforma aún no tiene sus datos. Seleccione la carpeta <b>datos</b> que le entregó la asesoría (contiene <code>plataforma_data.json</code>, la carpeta <code>fonts</code> y la carpeta de recortes).</p>
    <label class="btn primary" style="display:inline-block;cursor:pointer">Seleccionar la carpeta "datos"<input type="file" id="aDir" webkitdirectory multiple hidden></label>
    <div id="aProg" class="acc-prog"></div><p class="acc-msg" id="aMsg" role="status"></p>`);
  q('#aDir').addEventListener('change', async ev => {
    const files = [...ev.target.files];
    if (!files.some(f => /(^|\/)plataforma_data\.json$/.test(f.webkitRelativePath))) return msg('La carpeta elegida no contiene plataforma_data.json.', 'bad');
    const ok = await subirDatos(files, q('#aProg'));
    if (ok) location.reload();
  });
}
// Carpeta que contiene plataforma_data.json. Así funciona aunque se elija la carpeta de arriba
// (por ejemplo "3_datos"): solo se sube lo que está dentro de "datos" y sin ese prefijo.
function baseDatos(files) {
  const pj = files.find(f => /(^|\/)plataforma_data\.json$/.test(f.webkitRelativePath));
  return pj ? pj.webkitRelativePath.slice(0, -'plataforma_data.json'.length) : null;
}
async function subirDatos(files, prog) {
  const base = baseDatos(files);
  if (base === null) {
    const t = 'La carpeta elegida no contiene plataforma_data.json.';
    if (prog) prog.textContent = t;
    msg(t, 'bad');
    return false;
  }
  const sel = files.filter(f => f.webkitRelativePath.startsWith(base));
  let n = 0, fallos = [];
  for (const f of sel) {
    const rel = f.webkitRelativePath.slice(base.length);
    if (!rel || /(^|\/)\./.test(rel)) continue;
    const r = await sb.storage.from('datos').upload(rel, f, { upsert: true, contentType: f.type || (rel.endsWith('.json') ? 'application/json' : rel.endsWith('.webp') ? 'image/webp' : 'application/octet-stream') });
    if (r.error) fallos.push(rel + ': ' + traducir(r.error));
    n++; if (prog) prog.textContent = `Cargando ${n} de ${sel.length} archivos…`;
  }
  if (fallos.length) { msg('No se cargaron ' + fallos.length + ' archivos: ' + fallos.slice(0, 3).join('; '), 'bad'); return false; }
  if (prog) prog.textContent = `Listo: ${n} archivos cargados.`;
  return true;
}
BOOT.subirDatos = subirDatos;

/* =====================================================================
   SINCRONIZACIÓN con la base de datos
   El estado S de la aplicación se compara con una "sombra" de lo que hay
   en el servidor; cada vez que la app llama save(), se envían solo las
   diferencias. Cada campo lleva versión: si otra persona lo guardó
   mientras usted lo editaba, se avisa y nada se pierde.
   ===================================================================== */
const CAMPOS = ['J1', 'J2', 'J3', 'J4', 'J5', 'J6', 'J7', 'J8', 'J9', 'J10', 'J11', 'J2v', 'J8sel', 'J11sel', 'estado', 'resp', 'ia'];
const META = ['J2v', 'J8sel', 'J11sel', 'estado', 'resp', 'ia'];
const fieldOf = c => c === 'J2v' ? 'J2' : c === 'J8sel' ? 'J8' : c === 'J11sel' ? 'J11' : c;
function getC(j, c) { return META.includes(c) ? j[c] : (j.f || {})[c]; }
function setC(j, c, v) {
  if (c === 'estado') j.estado = v == null ? 0 : +v;
  else if (c === 'J2v') j.J2v = v == null ? 'cuenta con' : v;
  else if (META.includes(c)) j[c] = v == null ? '' : v;
  else { j.f = j.f || {}; if (v == null || v === '') delete j.f[c]; else j.f[c] = v; }
}
function norm(c, v) {
  if (v === undefined || v === null || v === '') return null;
  if (c === 'J2v' && v === 'cuenta con') return null;
  if (c === 'estado') return (+v) ? +v : null;
  return v;
}
const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const esPermiso = e => !!e && (e.code === '42501' || /permiso|row-level security|permission denied/i.test(e.message || ''));
function nuevoJ(S, code) {
  if (!S.juicios[code]) S.juicios[code] = { f: {}, J2v: 'cuenta con', estado: 0, resp: '', J8sel: '', J11sel: '' };
  const j = S.juicios[code];
  if (!j._c) Object.defineProperty(j, '_c', { value: code });
  return j;
}
function evObj(r) { return { ev: r.ev, code: r.code, titulo: r.titulo, tipo: r.tipo, anio: r.anio, unidad: r.unidad, plano: r.plano, solidez: r.solidez, campos: r.campos || [], archivo: r.archivo || '', archivo_id: r.archivo_id || null, estado: r.estado }; }
async function todos(tabla, orden) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    let qy = sb.from(tabla).select('*').range(i, i + 999);
    if (orden) qy = qy.order(orden);
    const r = await qy;
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  return out;
}

const SYNC = window.SYNC = {
  sh: {}, shEv: {}, shRec: {}, shAlin: {}, shBor: {},
  t: null, enCurso: false, cola: false, reint: null, rt: false, ultimo: '1970-01-01T00:00:00Z',
  estado: 'ok', oyentes: [],
  ver(code, c) { const s = (this.sh[code] || {})[c]; return s ? s.ver : 0; },
  autor(code, c) { const s = (this.sh[code] || {})[c]; return s ? s.by : null; },
  fecha(code, c) { const s = (this.sh[code] || {})[c]; return s ? s.at : null; },
  nombre(id) { const p = BOOT.perfiles[id]; return p ? (p.nombre || p.email) : 'otra persona'; },
  avisar(tipo, info) { this.oyentes.forEach(f => { try { f(tipo, info); } catch (e) { console.error(e); } }); },
  ponerEstado(e, det) { this.estado = e; this.avisar('estado', { estado: e, det }); },
  marcarUltimo(ts) { if (ts && ts > this.ultimo) this.ultimo = ts; },

  async cargar() {
    const uid = BOOT.user.id;
    const [campos, evs, recs, alin, bors] = await Promise.all([todos('campos'), todos('evidencias', 'creado_en'), todos('recursos'), todos('alin_procesos'), todos('borradores')]);
    const S = { juicios: {}, evidencias: [], recursos: {}, seq: 0, alin: { procesos: [] } };
    campos.forEach(r => {
      const j = nuevoJ(S, r.code); setC(j, r.campo, r.valor);
      (this.sh[r.code] = this.sh[r.code] || {})[r.campo] = { v: norm(r.campo, r.valor), ver: r.version, by: r.updated_by, at: r.updated_at };
      const k = fieldOf(r.campo), t = Date.parse(r.updated_at);
      j.ts = j.ts || {}; if (!j.ts[k] || t > j.ts[k]) j.ts[k] = t;
      this.marcarUltimo(r.updated_at);
    });
    evs.forEach(r => { const o = evObj(r); S.evidencias.push(o); this.shEv[o.ev] = JSON.stringify(o); this.marcarUltimo(r.updated_at); });
    recs.forEach(r => { (S.recursos[r.code] = S.recursos[r.code] || {})[r.item] = r.estado; this.shRec[r.code + '|' + r.item] = r.estado; this.marcarUltimo(r.updated_at); });
    alin.forEach(r => { S.alin.procesos.push(r.data); this.shAlin[r.id] = JSON.stringify(r.data); this.marcarUltimo(r.updated_at); });
    // borradores: los del servidor, o los del respaldo local si son más recientes (p. ej., se cortó la conexión)
    let local = null; try { local = JSON.parse(localStorage.getItem('mesa-borradores-' + uid) || 'null'); } catch (e) {}
    const bmap = {}; bors.forEach(r => { bmap[r.code] = { data: r.data, at: Date.parse(r.updated_at) }; this.shBor[r.code] = JSON.stringify(r.data); });
    if (local && local.bor) Object.entries(local.bor).forEach(([code, data]) => { if (!bmap[code] || local.ts > bmap[code].at) bmap[code] = { data, at: local.ts }; });
    Object.entries(bmap).forEach(([code, b]) => { if (b.data && b.data.d && Object.keys(b.data.d).length) { const j = nuevoJ(S, code); j.d = b.data.d; j.db = b.data.db || {}; } });
    this.S = S;
    window.addEventListener('beforeunload', ev => { if (this.pendiente()) { ev.preventDefault(); ev.returnValue = ''; } });
    window.addEventListener('online', () => this.programar());
    return S;
  },
  S: null,
  pendiente() { return !!(this.t || this.enCurso || this.cola || this.estado === 'error'); },

  respaldoLocal() {
    try {
      const bor = {}; Object.entries(this.S.juicios).forEach(([code, j]) => { if (j.d && Object.keys(j.d).length) bor[code] = { d: j.d, db: j.db || {} }; });
      localStorage.setItem('mesa-borradores-' + BOOT.user.id, JSON.stringify({ ts: Date.now(), bor }));
    } catch (e) {}
  },
  programar() {
    if (!this.S) return;
    this.respaldoLocal();
    clearTimeout(this.t); this.ponerEstado('guardando');
    this.t = setTimeout(() => { this.t = null; this.empujar(); }, 500);
  },

  async empujar() {
    if (this.enCurso) { this.cola = true; return; }
    this.enCurso = true; clearTimeout(this.reint);
    const S = this.S, conflictos = [], denegados = [];
    try {
      // 1. campos de los juicios
      for (const [code, j] of Object.entries(S.juicios)) {
        for (const c of CAMPOS) {
          const v = norm(c, getC(j, c)); const s = (this.sh[code] || {})[c]; const sv = s ? s.v : null;
          if (igual(v, sv)) { if (j.cb) delete j.cb[c]; continue; }
          const base = (j.cb && c in j.cb) ? j.cb[c] : (s ? s.ver : 0);
          const r = await sb.rpc('guardar_campo', { p_code: code, p_campo: c, p_valor: v, p_base: base, p_forzar: false });
          if (r.error && esPermiso(r.error)) { setC(j, c, sv); if (j.cb) delete j.cb[c]; denegados.push({ code, c, msg: r.error.message }); continue; }
          if (r.error) throw r.error;
          if (r.data.ok) {
            (this.sh[code] = this.sh[code] || {})[c] = { v, ver: r.data.version, by: r.data.updated_by, at: r.data.updated_at };
            if (j.cb) delete j.cb[c];
            j.ts = j.ts || {}; j.ts[fieldOf(c)] = Date.parse(r.data.updated_at);
            this.marcarUltimo(r.data.updated_at);
          } else conflictos.push({ code, c, mio: v, srv: r.data });
        }
      }
      // 2. conflictos: la versión del servidor queda vigente y la propia pasa a borrador
      conflictos.forEach(x => {
        const j = nuevoJ(S, x.code);
        (this.sh[x.code] = this.sh[x.code] || {})[x.c] = { v: norm(x.c, x.srv.valor), ver: x.srv.version, by: x.srv.updated_by, at: x.srv.updated_at };
        setC(j, x.c, x.srv.valor);
        if (j.cb) delete j.cb[x.c];
        if (!['estado', 'resp', 'ia'].includes(x.c)) { j.d = j.d || {}; j.d[x.c] = x.mio == null ? (x.c === 'J2v' ? 'cuenta con' : '') : x.mio; j.db = j.db || {}; j.db[x.c] = x.srv.version; }
      });
      // 3. borradores (privados)
      const codes = new Set([...Object.keys(this.shBor), ...Object.keys(S.juicios)]);
      for (const code of codes) {
        const j = S.juicios[code];
        const data = j && j.d && Object.keys(j.d).length ? { d: j.d, db: j.db || {} } : null;
        const js = data ? JSON.stringify(data) : undefined;
        if (js === this.shBor[code]) continue;
        const r = data ? await sb.from('borradores').upsert({ user_id: BOOT.user.id, code, data }) : await sb.from('borradores').delete().eq('code', code).eq('user_id', BOOT.user.id);
        if (r.error) throw r.error;
        if (data) this.shBor[code] = js; else delete this.shBor[code];
      }
      // 4. evidencias (las altas se hacen con registrarEvidencia)
      const vivos = new Set();
      for (const o of S.evidencias) {
        vivos.add(o.ev); const js = JSON.stringify(evObj(o));
        if (this.shEv[o.ev] === undefined || js === this.shEv[o.ev]) continue;
        const r = await sb.from('evidencias').update({ titulo: o.titulo, tipo: o.tipo, anio: o.anio, unidad: o.unidad, plano: o.plano, solidez: o.solidez, campos: o.campos, estado: o.estado, archivo_id: o.archivo_id || null, archivo: o.archivo || '' }).eq('ev', o.ev);
        if (r.error && esPermiso(r.error)) { Object.assign(o, JSON.parse(this.shEv[o.ev])); denegados.push({ code: o.code, c: o.ev }); continue; }
        if (r.error) throw r.error; this.shEv[o.ev] = js;
      }
      for (const ev of Object.keys(this.shEv)) if (!vivos.has(ev)) {
        const r = await sb.from('evidencias').delete().eq('ev', ev);
        if (r.error && esPermiso(r.error)) { const o = JSON.parse(this.shEv[ev]); S.evidencias.push(o); denegados.push({ code: o.code, c: ev }); continue; }
        if (r.error) throw r.error; delete this.shEv[ev];
      }
      // 5. recursos
      for (const [code, m] of Object.entries(S.recursos || {})) for (const [item, est] of Object.entries(m || {})) {
        if (this.shRec[code + '|' + item] === est) continue;
        const r = await sb.from('recursos').upsert({ code, item, estado: est });
        if (r.error && esPermiso(r.error)) { const prev = this.shRec[code + '|' + item]; if (prev === undefined) delete m[item]; else m[item] = prev; denegados.push({ code, c: item }); continue; }
        if (r.error) throw r.error; this.shRec[code + '|' + item] = est;
      }
      // 6. procesos manuales de alineación
      const ids = new Set();
      for (const p of ((S.alin || {}).procesos || [])) {
        ids.add(p.id); const js = JSON.stringify(p);
        if (this.shAlin[p.id] === js) continue;
        const r = await sb.from('alin_procesos').upsert({ id: p.id, data: p }); if (r.error) throw r.error; this.shAlin[p.id] = js;
      }
      for (const id of Object.keys(this.shAlin)) if (!ids.has(id)) { const r = await sb.from('alin_procesos').delete().eq('id', id); if (r.error) throw r.error; delete this.shAlin[id]; }
      this.ponerEstado(this.t ? 'guardando' : 'ok');
      if (conflictos.length) { this.respaldoLocal(); this.avisar('conflictos', conflictos); }
      if (denegados.length) this.avisar('denegado', denegados);
    } catch (e) {
      console.error('sincronización', e);
      this.ponerEstado('error', e);
      this.reint = setTimeout(() => this.empujar(), 10000);
    } finally {
      this.enCurso = false;
      if (this.cola) { this.cola = false; this.empujar(); }
    }
  },

  async registrarEvidencia(fila) {
    const r = await sb.from('evidencias').insert(fila).select().single();
    if (r.error) throw r.error;
    const o = evObj(r.data); this.S.evidencias.push(o); this.shEv[o.ev] = JSON.stringify(o);
    return o;
  },

  /* ---------- cambios de otras personas ---------- */
  aplicarCampo(r) {
    const s = (this.sh[r.code] || {})[r.campo];
    if (s && s.ver >= r.version) return false;
    (this.sh[r.code] = this.sh[r.code] || {})[r.campo] = { v: norm(r.campo, r.valor), ver: r.version, by: r.updated_by, at: r.updated_at };
    const j = nuevoJ(this.S, r.code);
    setC(j, r.campo, r.valor);
    j.ts = j.ts || {}; j.ts[fieldOf(r.campo)] = Date.parse(r.updated_at);
    this.marcarUltimo(r.updated_at);
    return true;
  },
  aplicar(tabla, tipo, r, viejo) {
    const S = this.S; let cambio = false;
    if (tabla === 'campos' && r) cambio = this.aplicarCampo(r);
    else if (tabla === 'evidencias') {
      if (tipo === 'DELETE') { const ev = (viejo || {}).ev; if (ev && this.shEv[ev] !== undefined) { S.evidencias = S.evidencias.filter(x => x.ev !== ev); delete this.shEv[ev]; cambio = true; } }
      else { const o = evObj(r), js = JSON.stringify(o); if (this.shEv[o.ev] !== js) { const i = S.evidencias.findIndex(x => x.ev === o.ev); if (i >= 0) S.evidencias[i] = o; else S.evidencias.push(o); this.shEv[o.ev] = js; cambio = true; } this.marcarUltimo(r.updated_at); }
    } else if (tabla === 'recursos' && r) {
      if (this.shRec[r.code + '|' + r.item] !== r.estado) { (S.recursos[r.code] = S.recursos[r.code] || {})[r.item] = r.estado; this.shRec[r.code + '|' + r.item] = r.estado; cambio = true; } this.marcarUltimo(r.updated_at);
    } else if (tabla === 'alin_procesos') {
      const lst = S.alin.procesos;
      if (tipo === 'DELETE') { const id = (viejo || {}).id; if (id && this.shAlin[id] !== undefined) { S.alin.procesos = lst.filter(p => p.id !== id); delete this.shAlin[id]; cambio = true; } }
      else { const js = JSON.stringify(r.data); if (this.shAlin[r.id] !== js) { const i = lst.findIndex(p => p.id === r.id); if (i >= 0) lst[i] = r.data; else lst.push(r.data); this.shAlin[r.id] = js; cambio = true; } this.marcarUltimo(r.updated_at); }
    } else if (tabla === 'perfiles' && r) {
      BOOT.perfiles[r.id] = r;
      if (r.id === BOOT.user.id) {
        const antes = BOOT.rol + '|' + BOOT.criterios.join(','), ahora = (r.rol || 'responsable') + '|' + (r.criterios || []).map(Number).sort((a, b) => a - b).join(',');
        BOOT.perfil = r; if (antes !== ahora) this.avisar('perfil', r);
      }
      cambio = true;
    }
    else if (tabla === 'archivos') cambio = true;
    if (cambio) this.avisar('remoto', { tabla, tipo, r: r || viejo });
  },
  tiempoReal() {
    try {
      const ch = sb.channel('mesa-cambios');
      ['campos', 'evidencias', 'recursos', 'alin_procesos', 'archivos', 'perfiles'].forEach(t =>
        ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => this.aplicar(t, p.eventType, p.new && Object.keys(p.new).length ? p.new : null, p.old)));
      ch.subscribe(st => { this.rt = st === 'SUBSCRIBED'; this.avisar('estado', { estado: this.estado }); });
      this.canal = ch;
    } catch (e) { this.rt = false; }
    // respaldo: si el tiempo real no está disponible, se consulta cada 20 s
    setInterval(() => { if (!this.rt && document.visibilityState === 'visible') this.sondear(); }, 20000);
  },
  async sondear() {
    try {
      const desde = this.ultimo;
      const [c, e, r, a, ids, ida] = await Promise.all([
        sb.from('campos').select('*').gt('updated_at', desde),
        sb.from('evidencias').select('*').gt('updated_at', desde),
        sb.from('recursos').select('*').gt('updated_at', desde),
        sb.from('alin_procesos').select('*').gt('updated_at', desde),
        sb.from('evidencias').select('ev'),
        sb.from('alin_procesos').select('id')]);
      (c.data || []).forEach(x => this.aplicar('campos', 'UPDATE', x));
      (e.data || []).forEach(x => this.aplicar('evidencias', 'UPDATE', x));
      (r.data || []).forEach(x => this.aplicar('recursos', 'UPDATE', x));
      (a.data || []).forEach(x => this.aplicar('alin_procesos', 'UPDATE', x));
      if (ids.data) { const set = new Set(ids.data.map(x => x.ev)); Object.keys(this.shEv).filter(ev => !set.has(ev)).forEach(ev => this.aplicar('evidencias', 'DELETE', null, { ev })); }
      if (ida.data) { const set = new Set(ida.data.map(x => x.id)); Object.keys(this.shAlin).filter(id => !set.has(id)).forEach(id => this.aplicar('alin_procesos', 'DELETE', null, { id })); }
      this.avisar('sondeo', {});
    } catch (e) { /* se reintenta en el próximo ciclo */ }
  }
};

document.addEventListener('DOMContentLoaded', iniciar);
})();

</script>
